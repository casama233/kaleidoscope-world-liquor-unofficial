name: Publish verified GitHub prerelease
on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-liquor-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'casama233/kaleidoscope-world-liquor-unofficial' && github.repository_id == '1385218112' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: world-liquor-src
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: world-liquor-src
          persist-credentials: false
      - name: Read exact paired source pin
        id: pin
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          commit=json.loads(Path('.github/release-request.json').read_text())['tavern_commit']
          assert re.fullmatch(r'[0-9a-f]{40}',commit)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('commit='+commit+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-tavern-unofficial
          ref: ${{ steps.pin.outputs.commit }}
          path: tavern-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify optional original source pin for publication-only recovery
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          request=json.loads(Path('.github/release-request.json').read_text())
          source=request.get('source_commit',os.environ['GITHUB_SHA'])
          assert re.fullmatch(r'[0-9a-f]{40}',source)
          subprocess.run(['git','merge-base','--is-ancestor',source,'HEAD'],check=True)
          subprocess.run(['git','diff','--exit-code',source,'HEAD','--','runtime/','tools/','docs/'],check=True)
          original=json.loads(subprocess.check_output(['git','show',source+':.github/release-request.json']))
          for data in (original,request):data.pop('source_commit',None)
          assert original==request,'Pinned source has different release metadata'
          with open(os.environ['GITHUB_ENV'],'a') as out:out.write('SOURCE_SHA='+source+'\n')
          PY
      - name: Validate and build exact committed source
        run: |
          python tools/build_storage_visuals.py
          python tools/rebuild_guide.py
          git diff --exit-code -- runtime/
          python tools/check_release.py
          python tools/build_release.py
          python tools/verify_release.py --export-env
      - name: Include source and static validation evidence
        run: |
          printf '%s\n' "$SOURCE_SHA" > dist/SOURCE_COMMIT
          cp docs/GUIDE-AUDIT-0.1.7.json docs/GUIDE-VALIDATION-0.1.7.json docs/STORAGE-VALIDATION-0.1.7.json dist/
      - name: Stage or resume identical draft, verify assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: casama233/kaleidoscope-world-liquor-unofficial
        run: |
          set -euo pipefail
          view_draft() {
            gh release view "$TAG" --repo "$GH_REPO" --json databaseId,tagName,targetCommitish,isDraft,isPrerelease,name,body
          }
          if view_draft > "$RUNNER_TEMP/draft-release.json"; then
            echo 'Existing release found; only an identical unpublished draft may resume.'
          else
            gh release create "$TAG" dist/* --repo "$GH_REPO" --target "$SOURCE_SHA" --title "$TITLE" --notes-file dist/RELEASE-NOTES.md --draft --prerelease
            view_draft > "$RUNNER_TEMP/draft-release.json"
          fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path(os.environ['RUNNER_TEMP'],'draft-release.json').read_text())
          assert r['isDraft'] is True and r['isPrerelease'] is True,'Refusing to modify a published release'
          assert r['tagName']==os.environ['TAG'] and r['targetCommitish']==os.environ['SOURCE_SHA']
          assert r['name']==os.environ['TITLE']
          assert r['body'].strip()==Path('dist/RELEASE-NOTES.md').read_text().strip()
          PY
          VERIFY_DIR="$RUNNER_TEMP/world-liquor-release-readback"
          mkdir -p "$VERIFY_DIR"
          export VERIFY_DIR
          gh release download "$TAG" --repo "$GH_REPO" --dir "$VERIFY_DIR"
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          def hashes(root):
              return {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in Path(root).iterdir() if p.is_file()}
          local=hashes('dist');remote=hashes(os.environ['VERIFY_DIR'])
          assert local==remote,'Existing draft asset bytes differ; refusing to replace them'
          refs=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GH_REPO']+'/git/matching-refs/tags/'+os.environ['TAG']]))
          exact=[r for r in refs if r['ref']=='refs/tags/'+os.environ['TAG']]
          assert len(exact)<=1
          if exact:assert exact[0]['object']['type']=='commit' and exact[0]['object']['sha']==os.environ['SOURCE_SHA']
          Path(os.environ['RUNNER_TEMP'],'asset-readback.json').write_text(json.dumps({'sourceCommit':os.environ['SOURCE_SHA'],'assets':remote,'archiveContentMatchesRuntime':True},indent=2)+'\n')
          print('Every uploaded asset matches the source build; no assets replaced.')
          PY
          view_draft > "$RUNNER_TEMP/draft-recheck.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          assert json.loads((root/'draft-release.json').read_text())==json.loads((root/'draft-recheck.json').read_text())
          PY
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --prerelease --latest=false
          test "$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha')" = "$SOURCE_SHA"
          gh release view "$TAG" --repo "$GH_REPO" --json url,tagName,isDraft,isPrerelease,publishedAt,targetCommitish > "$RUNNER_TEMP/published-release.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path(os.environ['RUNNER_TEMP'],'published-release.json').read_text())
          assert data['tagName']==os.environ['TAG'] and not data['isDraft'] and data['isPrerelease'] and data['publishedAt']
          assert data['targetCommitish']==os.environ['SOURCE_SHA']
          print(data)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: World-Liquor-publication-evidence
          path: |
            world-liquor-src/dist/
            ${{ runner.temp }}/published-release.json
            ${{ runner.temp }}/asset-readback.json
