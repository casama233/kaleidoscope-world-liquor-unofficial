name: Integrate reviewed cabinet storage repair
on:
  push:
    branches: ['fix/java-cabinet-storage-0.1.5']
    paths: ['.github/storage-input/**', '.github/workflows/storage-repair-apply.yml']
permissions:
  contents: read
concurrency:
  group: world-liquor-storage-repair-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'casama233/kaleidoscope-world-liquor-unofficial' && github.repository_id == '1385218112' && github.ref == 'refs/heads/fix/java-cabinet-storage-0.1.5'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: world-liquor-src
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-tavern-unofficial
          ref: 4076925dc04f1ea32882c03393d0328754513f11
          path: tavern-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Apply checksum-locked reviewed source delta
        working-directory: world-liquor-src
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,subprocess
          from pathlib import Path
          parts=sorted(Path('.github/storage-input').glob('part-*.b64'))
          assert len(parts)==3
          raw=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='b88655fa8aa4445f2c3198d59fbf3735a0819773b7c5a95658915ba24cbccf41'
          subprocess.run(['git','apply','--check','-'],input=raw,check=True)
          subprocess.run(['git','apply','-'],input=raw,check=True)
          PY
      - name: Check source matrices, unchanged gameplay and exact package
        working-directory: world-liquor-src
        run: |
          python tools/build_storage_visuals.py
          python tools/rebuild_guide.py
          python tools/check_release.py
          python tools/build_release.py
          python - <<'PY'
          import hashlib,subprocess,zipfile
          from pathlib import Path
          def snapshot():return {p.relative_to('runtime').as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('runtime').rglob('*') if p.is_file()}
          first=snapshot()
          for tool in ('build_storage_visuals.py','rebuild_guide.py'):subprocess.run(['python','tools/'+tool],check=True)
          assert snapshot()==first,'Generators must be idempotent'
          p=Path('dist/Kaleidoscope_World_Liquor_Unofficial_0.1.5_preview1.mcaddon')
          actual=hashlib.sha256(p.read_bytes()).hexdigest()
          assert actual=='82b1d7d80bda739adafd9e7569cd96d3790e82800d407562c81ed655e9b37d69',actual
          with zipfile.ZipFile(p) as z:
              assert len(z.namelist())==len(set(z.namelist())) and set(z.namelist())==set(first)
              assert all(hashlib.sha256(z.read(n)).hexdigest()==h for n,h in first.items())
          print('Complete archive matches reviewed runtime:',actual)
          PY
      - name: Commit repair on its branch only
        working-directory: world-liquor-src
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --exit-code -- .github/
          test "$(git ls-remote origin refs/heads/fix/java-cabinet-storage-0.1.5 | cut -f1)" = "$EXPECTED_HEAD"
          git add runtime/ tools/ data/ docs/ README.md package.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Repair addon cabinet bottle origins and append watermelon display for 0.1.5'
          git push origin HEAD:refs/heads/fix/java-cabinet-storage-0.1.5
          git rev-parse HEAD > dist/SOURCE_COMMIT
          git archive --format=zip HEAD > dist/integrated-source.zip
          cp docs/STORAGE-VALIDATION-0.1.5.json dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: World-Liquor-storage-integration
          path: world-liquor-src/dist/
          retention-days: 7
