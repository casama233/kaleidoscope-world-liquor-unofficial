name: Wall record regressions
on:
  push:
    branches: [main, 'fix/wall-record-*']
  pull_request:
permissions:
  contents: read
jobs:
  wall-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise runtime callbacks (not native game tests)
        run: node --experimental-loader ./tests/wall-record-loader.mjs --test tests/wall-record.test.mjs > wall-record-tests.tap
      - name: Verify generated geometry and unchanged converter
        run: python tests/test_wall_record_generation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wall-record-regression-results
          path: wall-record-tests.tap
          retention-days: 7
