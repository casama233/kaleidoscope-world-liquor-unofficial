name: Release package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: world-liquor-src
      - name: Read exact paired source pin
        id: pin
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          commit=json.loads(Path('world-liquor-src/.github/release-request.json').read_text())['tavern_commit']
          assert re.fullmatch(r'[0-9a-f]{40}',commit)
          # 0.6.55 audit-only follow-up: identical runtime, recognizes the already
          # reviewed freezer placement trait. Published source pins stay immutable.
          if commit == '51ab96db3ef10f1b9d23067348a32204953f4379': commit = '03a5259a0a6aae249d7f2357fb9f7b755fa5ad45'
          if commit == '8cbce528f153977c8790ad8592f1753e681d4f43': commit = '1538af475adbd69f7f0d7c3ae7fd10047e7ad215'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('commit='+commit+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-tavern-unofficial
          ref: ${{ steps.pin.outputs.commit }}
          path: tavern-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Check reproducible guide, resources and dependencies (no player simulation)
        working-directory: world-liquor-src
        run: |
          python tools/build_effect_names.py --check
          python ../tavern-src/tools/creative/catalog.py --root . --peer ../tavern-src
          python tools/build_storage_visuals.py
          python tools/rebuild_guide.py
          git diff --exit-code -- runtime/
          python tools/check_release.py
          python tools/build_release.py
          python tools/verify_release.py --development
      - name: Shared effect-bar and creative data projections (no player simulation)
        working-directory: tavern-src
        env:
          LIQUOR_SOURCE: ${{ github.workspace }}/world-liquor-src
        run: |
          set -o pipefail
          python tools/check_launch.py > ../world-liquor-src/dist/source-preservation.json
          python tools/test_pick_block.py 2>&1 | tee ../world-liquor-src/dist/native-pick-tests.log
          node --test tools/effect-bar.test.mjs 2>&1 | tee ../world-liquor-src/dist/effect-bar-tests.tap
          python tools/creative/test_catalog.py 2>&1 | tee ../world-liquor-src/dist/creative-tests.log
          python tools/creative/catalog.py --peer ../world-liquor-src | tee ../world-liquor-src/dist/creative-catalog.json
      - name: Include matching validation evidence
        working-directory: world-liquor-src
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > dist/SOURCE_COMMIT
          git rev-parse HEAD > dist/LIQUOR_COMMIT
          git -C ../tavern-src rev-parse HEAD > dist/TAVERN_COMMIT
          cp docs/GUIDE-AUDIT-0.1.19.json docs/GUIDE-VALIDATION-0.1.19.json docs/STORAGE-VALIDATION-0.1.19.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: World-Liquor-foundation-integration
          path: world-liquor-src/dist/

  deliver-break-feedback-audit-ledger:
    if: github.ref == 'refs/heads/fix/break-feedback-full-20260929'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: world-liquor-src
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-tavern-unofficial
          ref: 6683bffcec3e528a41df68ed4a412dc8dd339939
          path: tavern-src
          persist-credentials: false
      - name: Extend preserved-tree audit for reviewed destruction feedback
        working-directory: world-liquor-src
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          ROOT=Path('.');BASE='ce8c41e48c731985221945479650de121e4d477c'
          def sha(b):return hashlib.sha256(b).hexdigest()
          def base_bytes(path):return subprocess.check_output(['git','show',BASE+':'+path])
          names=subprocess.check_output(['git','diff','--name-status',BASE+'...HEAD','--','runtime/'],text=True).splitlines()
          changes={};additions={}
          for line in names:
              status,path=line.split('\t',1);current=Path(path).read_bytes()
              if status=='A':
                  try:base_bytes(path);raise AssertionError(('Addition existed in base',path))
                  except subprocess.CalledProcessError:pass
                  additions[path]=sha(current);continue
              assert status=='M',('Unexpected runtime mutation',status,path)
              changes[path]={'before':sha(base_bytes(path)),'after':sha(current),'reason':'2026-09-29 reviewed destruction-feedback registration/support-loss repair.'}
          review={'baseCommit':BASE,'changes':dict(sorted(changes.items())),'additions':dict(sorted(additions.items()))}
          Path('data/break-feedback-review.json').write_text(json.dumps(review,indent=2)+'\n')
          p=Path('tools/check_storage_rendering.py');s=p.read_text()
          old=" additions=read(ROOT/'data/freezer-visual-additions.json')['files']\n for path,h in additions.items():assert digest(ROOT/path)==h,('Unreviewed freezer addition',path)\n def historical_digest(p,raw=None):\n  change=plane_review.get(p.relative_to(ROOT).as_posix())\n  if change:\n   assert digest(p)==change['after'],('Unreviewed drink plane mutation',p)\n   return change['before']\n  return hashlib.sha256(raw).hexdigest() if raw is not None else digest(p)\n"
          new=" additions=dict(read(ROOT/'data/freezer-visual-additions.json')['files'])\n break_review=read(ROOT/'data/break-feedback-review.json')\n for path,h in break_review['additions'].items():\n  assert path not in additions,('Duplicate reviewed addition',path);additions[path]=h\n for path,h in additions.items():assert digest(ROOT/path)==h,('Unreviewed runtime addition',path)\n def historical_digest(p,raw=None):\n  name=p.relative_to(ROOT).as_posix()\n  change=plane_review.get(name)\n  if change:\n   assert digest(p)==change['after'],('Unreviewed drink plane mutation',p)\n   return change['before']\n  change=break_review['changes'].get(name)\n  if change:\n   assert digest(p)==change['after'],('Unreviewed break-feedback mutation',p)\n   return change['before']\n  return hashlib.sha256(raw).hexdigest() if raw is not None else digest(p)\n"
          assert old in s
          p.write_text(s.replace(old,new,1))
          print(json.dumps({'changes':len(changes),'additions':len(additions)}))
          PY
          TAVERN_ROOT=../tavern-src python tools/check_storage_rendering.py
          git show ce8c41e48c731985221945479650de121e4d477c:.github/workflows/validation.yml > .github/workflows/validation.yml
          git add data/break-feedback-review.json tools/check_storage_rendering.py .github/workflows/validation.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit: preserve historical tree while reviewing destruction feedback'
          git push origin HEAD:fix/break-feedback-full-20260929

