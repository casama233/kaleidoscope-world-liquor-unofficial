name: Release package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: world-liquor-src
      - name: Read exact paired source pin
        id: pin
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          commit=json.loads(Path('world-liquor-src/.github/release-request.json').read_text())['tavern_commit']
          assert re.fullmatch(r'[0-9a-f]{40}',commit)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('commit='+commit+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-tavern-unofficial
          ref: ${{ steps.pin.outputs.commit }}
          path: tavern-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Check reproducible guide, resources and dependencies (no player simulation)
        working-directory: world-liquor-src
        run: |
          python tools/build_effect_names.py --check
          python ../tavern-src/tools/creative/catalog.py --root . --peer ../tavern-src
          python tools/build_storage_visuals.py
          python tools/rebuild_guide.py
          git diff --exit-code -- runtime/
          python tools/check_release.py
          python tools/build_release.py
          python tools/verify_release.py --development
      - name: Shared effect-bar and creative data projections (no player simulation)
        working-directory: tavern-src
        env:
          LIQUOR_SOURCE: ${{ github.workspace }}/world-liquor-src
        run: |
          set -o pipefail
          # The pinned release's old byte-only pick guard predates the reviewed
          # destruction/potion repair. Keep its behavioral assertions and use
          # the broader reviewed-source gate for preservation.
          python tools/check_launch.py > ../world-liquor-src/dist/source-preservation.json
          python tools/test_pick_block.py PickDefinitions.test_native_registrations_are_complete_in_both_packs PickDefinitions.test_native_replacement_never_changes_placed_identifier PickDefinitions.test_registration_only_placers_do_not_enable_native_script_bypass PickDefinitions.test_compat_audit_accepts_tag_only_block_descriptors PickDefinitions.test_no_addon_pick_runtime_or_second_storage_owner 2>&1 | tee ../world-liquor-src/dist/native-pick-tests.log
          node --test tools/effect-bar.test.mjs 2>&1 | tee ../world-liquor-src/dist/effect-bar-tests.tap
          python tools/creative/test_catalog.py 2>&1 | tee ../world-liquor-src/dist/creative-tests.log
          python tools/creative/catalog.py --peer ../world-liquor-src | tee ../world-liquor-src/dist/creative-catalog.json
      - name: Include matching validation evidence
        working-directory: world-liquor-src
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > dist/SOURCE_COMMIT
          git rev-parse HEAD > dist/LIQUOR_COMMIT
          git -C ../tavern-src rev-parse HEAD > dist/TAVERN_COMMIT
          cp docs/GUIDE-AUDIT-0.1.11.json docs/GUIDE-VALIDATION-0.1.11.json docs/STORAGE-VALIDATION-0.1.11.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: World-Liquor-foundation-integration
          path: world-liquor-src/dist/
