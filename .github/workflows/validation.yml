name: Release package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: world-liquor-src
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-tavern-unofficial
          ref: 108a893a5f220a3f5965e39618e0420f1aaf2a2e
          path: tavern-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Check reproducible guide, resources and dependencies (no player simulation)
        working-directory: world-liquor-src
        run: |
          python tools/build_storage_visuals.py
          python tools/rebuild_guide.py
          git diff --exit-code -- runtime/
          python tools/check_release.py
          python tools/build_release.py
          python tools/verify_release.py --development
      - name: Shared foundation cross-pack script regressions (not BDS/client)
        working-directory: tavern-src
        env:
          LIQUOR_SOURCE: ${{ github.workspace }}/world-liquor-src
        run: |
          set -o pipefail
          node --experimental-loader ./tools/foundation/mock-loader.mjs --test ./tools/foundation/foundation.test.mjs 2>&1 | tee ../world-liquor-src/dist/foundation-tests.tap
      - name: Include matching validation evidence
        working-directory: world-liquor-src
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > dist/SOURCE_COMMIT
          git rev-parse HEAD > dist/LIQUOR_COMMIT
          git -C ../tavern-src rev-parse HEAD > dist/TAVERN_COMMIT
          cp docs/GUIDE-AUDIT-0.1.5.json docs/GUIDE-VALIDATION-0.1.5.json docs/STORAGE-VALIDATION-0.1.5.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: World-Liquor-foundation-integration
          path: world-liquor-src/dist/
