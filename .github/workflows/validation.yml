name: Release package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: world-liquor-src
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-tavern-unofficial
          ref: 52a0e42d67e9e1e805bc052be4d9b8d13a8ae1fb
          path: tavern-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Check reproducible guide, resources and dependencies (no player simulation)
        working-directory: world-liquor-src
        run: |
          python tools/rebuild_guide.py
          git diff --exit-code -- runtime/
          python tools/check_release.py
          python tools/build_release.py
          python tools/verify_release.py
      - name: Include matching validation evidence
        working-directory: world-liquor-src
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > dist/SOURCE_COMMIT
          cp docs/GUIDE-AUDIT-0.1.4.json docs/GUIDE-VALIDATION-0.1.4.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: World-Liquor-public-preview
          path: world-liquor-src/dist/
