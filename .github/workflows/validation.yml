name: Release package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: world-liquor-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python tools/baseline_gate.py check --release --history-base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - run: python tools/test_baseline_gate.py
      - run: python tools/test_release_claim.py
      - run: python tools/test_bridge_project.py
      - run: python -m pip install PyYAML==6.0.2
      - run: python tools/test_workflow_contracts.py
  bridge:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Preserve canonical line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download checksum-pinned official Dash v1.2.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:RUNNER_TEMP 'dash.exe'
          Invoke-WebRequest 'https://github.com/bridge-core/deno-dash-compiler/releases/download/v1.2.0/dash.exe' -OutFile $path
          $expected = '00bb6d984f0ffb819e2fb26c1eda5768db2d6e07a979712e34e1c76c2b7594de'
          if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Dash executable checksum mismatch' }
      - name: Compile current canonical BP and RP with bridge Dash
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/dash.exe" build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reject omitted files, runtime rewrites, version or UUID drift
        run: |
          python tools/bridge_project.py --verify-export builds/dist
          python tools/baseline_gate.py check --release
          git diff --exit-code
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: world-liquor-src
      - name: Read exact paired source pin
        id: pin
        run: |
          python - <<'PY'
          import json,os,re
          from pathlib import Path
          commit=json.loads(Path('world-liquor-src/.github/baseline-integration.json').read_text())['tavern_commit']
          assert re.fullmatch(r'[0-9a-f]{40}',commit)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('commit='+commit+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-tavern-unofficial
          ref: ${{ steps.pin.outputs.commit }}
          path: tavern-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Check reproducible guide, resources and dependencies (no player simulation)
        working-directory: world-liquor-src
        run: |
          python tools/test_effect_names.py
          python tools/build_effect_names.py --check
          python ../tavern-src/tools/creative/catalog.py --root . --peer ../tavern-src
          python tools/build_storage_visuals.py
          python tools/rebuild_guide.py
          git diff --exit-code -- runtime/
          node --experimental-loader ./tests/wall-record-loader.mjs --test tests/freezer-callback.test.mjs
          node --test tests/record-audio.test.mjs tests/multi-jump.test.mjs tests/freezer-state.test.mjs
          python tools/check_release.py
          python tools/build_release.py
          python tools/verify_release.py --development
      - name: Shared effect-bar and creative data projections (no player simulation)
        working-directory: tavern-src
        env:
          LIQUOR_SOURCE: ${{ github.workspace }}/world-liquor-src
        run: |
          set -o pipefail
          python tools/check_launch.py > ../world-liquor-src/dist/source-preservation.json
          python tools/test_pick_block.py 2>&1 | tee ../world-liquor-src/dist/native-pick-tests.log
          node --test tools/effect-bar.test.mjs 2>&1 | tee ../world-liquor-src/dist/effect-bar-tests.tap
          python tools/creative/test_catalog.py 2>&1 | tee ../world-liquor-src/dist/creative-tests.log
          python tools/creative/catalog.py --peer ../world-liquor-src | tee ../world-liquor-src/dist/creative-catalog.json
      - name: Include matching validation evidence
        working-directory: world-liquor-src
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf '%s\n' "$SOURCE_SHA" > dist/SOURCE_COMMIT
          git rev-parse HEAD > dist/LIQUOR_COMMIT
          git -C ../tavern-src rev-parse HEAD > dist/TAVERN_COMMIT
          version="$(python -c 'import json; print(".".join(map(str,json.load(open("baseline.json"))["version"])))')"
          cp "docs/GUIDE-VALIDATION-${version}.json" "docs/STORAGE-VALIDATION-${version}.json" docs/BDS-FAMILY-20261001.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: World-Liquor-foundation-integration
          path: world-liquor-src/dist/

  wall-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise runtime callbacks (not native game tests)
        run: node --experimental-loader ./tests/wall-record-loader.mjs --test tests/wall-record.test.mjs > wall-record-tests.tap
      - name: Verify generated geometry and unchanged converter
        run: python tests/test_wall_record_generation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wall-record-regression-results
          path: wall-record-tests.tap
          retention-days: 7
