name: Apply verified foundation adapter
on:
  push:
    branches: [refactor/shared-foundation-20260925]
    paths: ['.github/workflows/apply-foundation.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'casama233/kaleidoscope-world-liquor-unofficial' && github.ref == 'refs/heads/refactor/shared-foundation-20260925'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: liquor
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          repository: casama233/kaleidoscope-tavern-unofficial
          ref: 108a893a5f220a3f5965e39618e0420f1aaf2a2e
          path: tavern
          persist-credentials: false
      - name: Verify exact locally tested paired source
        working-directory: liquor
        run: |
          test "$(git rev-parse HEAD^)" = e7e808ca7124ad6e1641b373d6f07e9a29be19c3
          python - <<'PY'
          from pathlib import Path
          import lzma,hashlib
          patch=lzma.decompress(Path('.foundation-transfer/patch.xz').read_bytes())
          assert len(patch)==23546
          assert hashlib.sha256(patch).hexdigest()=='bdc60452c5ca578bc769d7aaa144022fca0728d70cac028b166f1a7e8a7969ec'
          Path('/tmp/foundation.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero /tmp/foundation.patch
          git apply --index --unidiff-zero /tmp/foundation.patch
          for name in protocol.js tavern-extension-client.js tavern-foundation-client.js tavern-effects.js; do
            cp "../tavern/sdk/$name" "runtime/BP/scripts/sdk/$name"
          done
          cp ../tavern/docs/FOUNDATION-PHASE1.md docs/FOUNDATION-PHASE1.md
          git add -- runtime/BP/scripts/sdk/ docs/FOUNDATION-PHASE1.md
          git rm -- .foundation-transfer/patch.xz .github/workflows/apply-foundation.yml
          test "$(git write-tree)" = 50bcdb6a3d8916b6a8bfc75039502abf57b36dc6
          git restore --source=HEAD --staged --worktree -- .github/workflows/validation.yml .github/workflows/apply-foundation.yml .foundation-transfer/patch.xz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: delegate cabinets and timed status to Tavern foundation'
          git push origin HEAD:refs/heads/refactor/shared-foundation-20260925
